<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d4f4f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%A6%B7%3C/text%3E%3C/svg%3E">

<style>
:root{--bg:#eef2f3;--ink:#1d2b2f;--mut:#5b6b70;--line:#cfd9db;--card:#fff;--acc:#0f6b6b;--acc2:#0a4f4f;--warn:#a1480b;--warnbg:#fdf1e4}
@media (prefers-color-scheme:dark){:root{--bg:#121a1c;--ink:#e6eeef;--mut:#9aabb0;--line:#2c3b3f;--card:#1a2528;--acc:#4cc0b8;--acc2:#7ad8d0;--warn:#f0a35e;--warnbg:#2e2216}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Sarabun',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55}
header{padding:28px 20px 8px;max-width:900px;margin:0 auto}
h1{margin:0 0 6px;font-size:28px;font-weight:700}
header p{margin:0;color:var(--mut)}
main{max-width:900px;margin:0 auto;padding:28px 20px 60px}
#drop{display:block;border:2px dashed var(--acc);border-radius:10px;padding:34px 16px;text-align:center;cursor:pointer;background:var(--card);font-weight:600;color:var(--acc)}
#drop.over{background:var(--bg)}
#drop input{display:none}
#drop small{display:block;font-weight:400;color:var(--mut);margin-top:4px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.row label{flex:1 1 240px;font-size:14px;color:var(--mut)}
input[type=text],select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.card.off{opacity:.55}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.top b{font-size:17px}
.n{color:var(--acc);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.grid label{font-size:13px;color:var(--mut)}
.auto{display:block;margin-top:10px;font-size:14px;color:var(--mut)}
.pv{margin:10px 0 0;font-size:14px;color:var(--mut)}
#msg{margin:14px 0;padding:10px 12px;border-radius:6px;background:var(--warnbg);color:var(--warn);font-size:14px}
#msg:empty{display:none}
button{font:inherit;font-weight:600;padding:12px 22px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
button:hover{background:var(--acc2)}
button:focus-visible,input:focus-visible,select:focus-visible,#drop:focus-within{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-color-scheme:dark){button{color:#0b1416}}

.cover{max-width:none;margin:0;padding:44px 20px 40px;background:#0d4f4f;color:#fff}
.cv-in{max-width:900px;margin:0 auto;display:flex;gap:32px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cv-txt{flex:1 1 380px}
.cover h1{font-size:42px;line-height:1.15;margin:0 0 10px;letter-spacing:-.01em}
.cover p{color:#cfe6e4;margin:0 0 20px;max-width:34em}
.cv-tag{font-size:14px;margin-bottom:10px!important;color:#8fd6cf!important;font-weight:600}
.cv-steps{list-style:none;margin:0 0 24px;padding:0;display:flex;gap:10px;flex-wrap:wrap}
.cv-steps li{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 14px 6px 6px;font-size:15px}
.cv-steps b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#fff;color:#0d4f4f;font-size:14px}
.cv-go{display:inline-block;background:#fff;color:#0d4f4f;text-decoration:none;font-weight:700;padding:12px 26px;border-radius:8px}
.cv-go:hover{background:#e3f3f1}
.cv-go:focus-visible{outline:3px solid #8fd6cf;outline-offset:3px}
.cv-note{display:block;margin-top:14px;font-size:13px;color:#8fd6cf}
.cv-art{flex:0 0 auto;width:190px;height:auto}
@media (max-width:560px){.cover h1{font-size:34px}.cv-art{width:120px}}
</style>
</head>
<body>
<header class="cover">
<div class="cv-in">
<div class="cv-txt">
<p class="cv-tag">งานทันตสาธารณสุข · อนามัยโรงเรียน</p>
<h1>แบบตรวจฟันนักเรียน</h1>
<p>ใส่ไฟล์รายชื่อของโรงเรียนไหนก็ได้ แล้วได้แบบตรวจคัดกรองสุขภาพช่องปากแยกตามห้อง พร้อมพิมพ์ A4</p>
<ol class="cv-steps"><li><b>1</b>ใส่ไฟล์รายชื่อ</li><li><b>2</b>เช็กคอลัมน์</li><li><b>3</b>ดาวน์โหลดแล้วพิมพ์</li></ol>
<a class="cv-go" href="#drop">เริ่มเลย</a>
<span class="cv-note">ข้อมูลเด็กประมวลผลในเครื่องนี้เท่านั้น ไม่ถูกส่งไปที่ไหน</span>
</div>
<svg class="cv-art" viewBox="0 0 160 190" role="img" aria-label="ภาพฟันกับเครื่องหมายถูก">
<path d="M80 22c-18-12-50-6-58 20-5 18 3 34 8 52 5 21 3 52 16 76 7 13 16 10 19-5 3-16 5-40 15-40s12 24 15 40c3 15 12 18 19 5 13-24 11-55 16-76 5-18 13-34 8-52-8-26-40-32-58-20z" fill="rgba(255,255,255,.12)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
<circle cx="122" cy="40" r="26" fill="#8fd6cf"/>

</svg>

</header>
<main>
<label id="drop"><input type="file" id="f" accept=".xlsx,.docx">เลือกไฟล์รายชื่อ หรือลากมาวางที่นี่<small>รองรับ Excel (.xlsx) และ Word (.docx) ที่เป็นตารางรายชื่อ ถ้าเป็น .xls หรือ .doc ให้บันทึกเป็นรุ่นใหม่ก่อน</small></label>
<section id="cfg" hidden>
<div class="row">
<label>ชื่อโรงเรียน<input type="text" id="school" placeholder="เช่น อนุบาลเพชรบูรณ์"></label>
<label>วันที่ตรวจ (เว้นว่างไว้เขียนมือได้)<input type="text" id="date" placeholder="เช่น 5 พ.ย. 2569"></label>
<label>กระดาษ A4 (ห้องที่คนเยอะจะต่อหน้าถัดไปเอง)<select id="ori"><option value="landscape">แนวนอน: ช่องกว้าง เขียนสบาย ราว 18 คน/หน้า</option><option value="portrait">แนวตั้ง: ราว 38 คน/หน้า ตัวเล็กลง</option></select></label>
<label>แยกชีตในไฟล์ที่ได้ตาม<select id="by"><option value="room">ห้อง (ป2/1, ป2/2 ...)</option><option value="grade">ชั้น (ป2 รวมทุกห้อง)</option></select></label>
<label>ความสูงแถว (เขียนมือ ใช้ 23 ขึ้นไป)<input type="text" id="rh" value="23.4" inputmode="decimal"></label>
</div>
<div id="list"></div>
<div id="msg" role="status"></div>
<button id="go" type="button">ดาวน์โหลดไฟล์แบบตรวจ</button>

<script>
const PRE=['เด็กหญิง','เด็กชาย','นางสาว','ด.ช.','ด.ญ.','น.ส.','ดช.','ดญ.','นส.','ด.ช','ด.ญ','นาย','นาง'];
const PREFULL=/^(เด็กหญิง|เด็กชาย|นางสาว|ด\.?ช\.?|ด\.?ญ\.?|น\.?ส\.?|นาย|นาง)$/;
let S=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function str(v){
  if(v==null)return '';
  if(v instanceof Date)return '';
  if(typeof v==='object'){
    if(v.richText)return v.richText.map(t=>t.text).join('').trim();
    if('result' in v)return str(v.result);
    if(v.text!=null)return str(v.text);
    return '';
  }
  return String(v).trim();
}
const idOf=s=>{const d=String(s||'').replace(/[\s-]/g,'');return (/^\d{13}$/.test(d)||/^[A-Za-z]\d{8,13}$/.test(d))?d.toUpperCase():''};
const isText=c=>c.length>1&&/[ก-๙A-Za-z]/.test(c)&&!/^(ชาย|หญิง)$/.test(c);
function normPre(s){
  s=(s||'').replace(/\s/g,'');
  if(/^(เด็กชาย|ด\.?ช\.?)$/.test(s))return 'ด.ช.';
  if(/^(เด็กหญิง|ด\.?ญ\.?)$/.test(s))return 'ด.ญ.';
  if(/^(นางสาว|น\.?ส\.?)$/.test(s))return 'น.ส.';
  return s;
}
function splitPre(s){
  for(const p of PRE){if(s.startsWith(p)&&s.length>p.length)return [p,s.slice(p.length).trim()]}
  return ['',s];
}
function colName(i){let s='';i++;while(i>0){s=String.fromCharCode(65+(i-1)%26)+s;i=Math.floor((i-1)/26)}return s}
function checksumOk(id){let t=0;for(let i=0;i<12;i++)t+=+id[i]*(13-i);return (11-t%11)%10===+id[12]}

function gridOf(ws){
  const R=Math.min(ws.rowCount,4000),C=Math.min(ws.columnCount,30),g=[];
  for(let r=1;r<=R;r++){
    const row=ws.getRow(r),a=[];
    for(let c=1;c<=C;c++)a.push(str(row.getCell(c).value));
    g.push(a);
  }
  return g;
}

function detect(g){
  const nc=Math.max(0,...g.map(r=>r.length));
  const cnt=Array(nc).fill(0);
  g.forEach(r=>r.forEach((c,i)=>{if(idOf(c))cnt[i]++}));
  const mx=Math.max(0,...cnt);
  const m={id:-1,pre:-1,fn:-1,ln:-1,rm:-1,sq:-1,gr:-1};
  if(!mx)return {m,nc,sample:g.find(r=>r.some(Boolean))||[]};
  const id=cnt.indexOf(mx);m.id=id;
  const rows=g.filter(r=>idOf(r[id]));
  const GR=/^(ป|ม|อ|อนุบาล)\.?\s?\d$/;
  for(let i=0;i<nc&&m.gr<0;i++){if(i!==id&&rows.filter(r=>GR.test((r[i]||'').trim())).length>=rows.length*.6)m.gr=i}
  if(m.gr>=0)for(let j=m.gr+1;j<=m.gr+3&&j<nc;j++){
    const v=rows.map(r=>(r[j]||'').trim());
    if(v.filter(x=>/^\d{1,2}$/.test(x)).length>=rows.length*.8&&new Set(v).size<=15){m.rm=j;break}
  }
  const dt=i=>{if(i>=nc||i===id)return 0;let c=0;rows.forEach(r=>{const v=r[i]||'';if(isText(v)||/^[-–—.]+$/.test(v))c++});return c/rows.length};
  let bs=0;
  for(let i=0;i<nc;i++){if(i===id)continue;const c=rows.filter(r=>/^\d{1,3}$/.test(r[i]||'')).length;if(c>bs&&c>=rows.length*.6){bs=c;m.sq=i}}
  const S2=[];
  for(let i=0;i<nc;i++){
    if(i===id){S2.push(null);continue}
    let t=0,pf=0,ps=0,sp=0;
    rows.forEach(r=>{const c=r[i]||'';if(isText(c)){t++;
      if(PREFULL.test(c.replace(/\s/g,'')))pf++;
      else if(PRE.some(p=>c.startsWith(p)&&c.length>p.length+1))ps++;
      if(/\s/.test(c))sp++}});
    const n=rows.length;S2.push({t:t/n,pf:pf/n,ps:ps/n,sp:sp/n});
  }
  const txt=i=>S2[i]&&S2[i].t>.6;
  const idx=[...Array(nc).keys()];
  const pre=S2.findIndex(s=>s&&s.pf>.6);
  if(pre>=0){
    m.pre=pre;
    const rest=idx.filter(i=>i>pre&&txt(i));
    m.fn=rest.length?rest[0]:-1;
    if(m.fn>=0&&S2[m.fn].sp<.5)m.ln=dt(m.fn+1)>.6?m.fn+1:-1;
  }else{
    const ps=S2.findIndex(s=>s&&s.ps>.5);
    if(ps>=0)m.fn=ps;
    else{
      const rest=idx.filter(txt);
      m.fn=rest.length?rest[0]:-1;
      if(m.fn>=0&&S2[m.fn].sp<.5)m.ln=dt(m.fn+1)>.6?m.fn+1:-1;
    }
  }
  return {m,nc,sample:rows[0]};
}

function roomOf(t){
  const m=t.match(/(ป|ม|อ)\.?\s?(\d)\s*[\/\-]\s*(\d{1,2})/);
  if(m)return m[1]+m[2]+'/'+m[3];
  const h=t.match(/ห้อง\s*(\d{1,2})/);
  return h?'ห้อง '+h[1]:'';
}
function labelOf(n){
  let m=n.match(/^([ก-ฮ]+)\.?\s*(\d+)[.\/\-\s]+(\d+)$/);
  if(m)return m[1]+m[2]+'/'+m[3];
  m=n.match(/^([ก-ฮ]+)\.?\s*(\d+)$/);
  return m?m[1]+m[2]:n;
}
function extract(g,m,auto,label){
  if(m.id<0||m.fn<0)return [];
  const split=auto&&m.rm<0&&m.gr<0,out=[];
  let cur='',last=0,idx=1;
  g.forEach(r=>{
    const id=idOf(r[m.id]);
    if(!id){if(split){const t=roomOf(r.join(' '));if(t)cur=t}return}
    let pre=m.pre>=0?normPre(r[m.pre]):'',fn=(r[m.fn]||'').trim(),ln=m.ln>=0?(r[m.ln]||'').trim():'';
    if(m.ln<0){
      if(!pre){const [p,f]=splitPre(fn);pre=normPre(p);fn=f}
      const w=fn.split(/\s+/);fn=w.shift()||'';ln=w.join(' ');
    }else if(m.pre<0){
      const [p,f]=splitPre(fn);if(p){pre=normPre(p);fn=f}
    }
    if(/^[-–—.]+$/.test(ln))ln='';
    let rm=m.rm>=0?(r[m.rm]||'').trim():'';
    if(m.gr>=0){const gv=(r[m.gr]||'').replace(/[.\s]/g,'');rm=gv?(rm?gv+'/'+rm:gv):''}
    const o={id,pre,fn,ln,rm,cur:'',idx:1};
    if(split){
      const sq=m.sq>=0?parseInt(r[m.sq],10):NaN;
      if(!isNaN(sq)){if(sq<last&&sq<=1)idx++;last=sq}
      o.cur=cur;o.idx=idx;
    }
    out.push(o);
  });
  if(split){
    const hd=new Set(out.map(o=>o.cur).filter(Boolean)),mi=Math.max(1,...out.map(o=>o.idx));
    out.forEach(o=>{if(hd.size>=2)o.rm=o.cur;else if(mi>=2)o.rm=`${label}/${o.idx}`});
  }
  return out;
}
function groupsOf(rows,label){
  const g=new Map();rows.forEach(r=>{const k=r.rm||label;g.set(k,(g.get(k)||0)+1)});return g;
}

function opts(s,key){
  let h='<option value="-1">— ไม่มี —</option>';
  for(let i=0;i<s.nc;i++)h+=`<option value="${i}" ${s.m[key]===i?'selected':''}>${colName(i)} · ${esc((s.sample[i]||'').slice(0,16))}</option>`;
  return h;
}
function render(){
  $('list').innerHTML=S.map((s,k)=>{
    const gp=groupsOf(s.rows,s.label);
    const pv0=s.rows.length?s.rows.slice(0,3).map(r=>esc(`${r.pre} ${r.fn} ${r.ln}`.trim())).join(' / '):'ไม่พบเลขบัตร 13 หลักในชีตนี้ (ถ้าไม่ใช่ชีตรายชื่อ ปล่อยไว้ได้)';
    const pv=(gp.size>1?`<b>แยกได้ ${gp.size} ห้อง:</b> ${[...gp].map(([k,n])=>esc(k)+' ('+n+')').join(', ')}<br>`:'')+pv0;
    const sel=(f,l)=>`<label>${l}<select data-k="${k}" data-f="${f}">${opts(s,f)}</select></label>`;
    return `<div class="card ${s.on?'':'off'}">
<div class="top"><label><input type="checkbox" data-k="${k}" data-f="on" ${s.on?'checked':''}> <b>ชีต ${esc(s.name)}</b></label><span class="n">${s.rows.length} คน</span></div>
<div class="grid">
<label>ชื่อห้อง/ชั้นในหัวแบบ<input type="text" data-k="${k}" data-f="label" value="${esc(s.label)}"></label>
${sel('id','เลขบัตร')}${sel('pre','คำนำหน้า')}${sel('fn','ชื่อ (หรือชื่อ-สกุล)')}${sel('ln','สกุล')}${sel('gr','ชั้น (ถ้ามีคอลัมน์ชั้น)')}${sel('rm','ห้อง (ถ้ารวมหลายห้องในชีตเดียว)')}
</div><label class="auto"><input type="checkbox" data-k="${k}" data-f="auto" ${s.auto?'checked':''}> แยกห้องอัตโนมัติ (ชีตที่รวมหลายห้อง ตัดเมื่อลำดับเริ่มนับ 1 ใหม่ หรือเจอหัวข้อห้อง)</label><p class="pv">${pv}</p></div>`;
  }).join('');
  validate();
}
function used(){return S.filter(s=>s.on&&s.rows.length)}
function validate(){
  const all=used().flatMap(s=>s.rows),seen=new Set();let dup=0,bad=0;
  all.forEach(r=>{if(seen.has(r.id))dup++;seen.add(r.id);if(/^\d/.test(r.id)&&!checksumOk(r.id))bad++});
  const w=[];
  if(dup)w.push(`พบเลขบัตรซ้ำ ${dup} รายการ`);
  if(bad)w.push(`เลขบัตร ${bad} รายการไม่ผ่านการตรวจหลักที่ 13 (อาจพิมพ์ผิด)`);
  const nm=all.filter(r=>!r.ln).length;
  if(nm)w.push(`${nm} คนไม่มีนามสกุล (ถ้าเป็นเด็กที่ไม่มีนามสกุลจริงข้ามได้ ถ้ามากผิดปกติให้ลองตรวจการเลือกคอลัมน์)`);
  $('msg').textContent=w.join(' · ');
  $('go').disabled=!used().length;
}

async function readDocx(buf){
  const z=await JSZip.loadAsync(buf),f=z.file('word/document.xml');
  if(!f)throw new Error('ไม่ใช่ไฟล์ .docx');
  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const xml=new DOMParser().parseFromString(await f.async('string'),'application/xml');
  const body=xml.getElementsByTagNameNS(W,'body')[0];
  const kids=n=>[...n.childNodes].filter(c=>c.nodeType===1);
  const txt=el=>{let t='';(function walk(n){for(const c of kids(n)){
    const l=c.localName;
    if(l==='t')t+=c.textContent;else if(l==='tab')t+='\t';else if(l==='br'||l==='cr')t+=' ';
    else{walk(c);if(l==='p')t+=' '}}})(el);return t.trim()};
  const sheets=[],paras=[];let pending='',nt=0;
  for(const el of kids(body)){
    if(el.localName==='p'){const t=txt(el);if(t){paras.push(t);if(roomOf(t))pending=roomOf(t)}}
    else if(el.localName==='tbl'){
      const g=[];
      for(const tr of kids(el).filter(c=>c.localName==='tr')){
        const row=[];
        for(const tc of kids(tr).filter(c=>c.localName==='tc')){
          const pr=kids(tc).find(c=>c.localName==='tcPr'),pk=pr?kids(pr):[];
          const gs=pk.find(c=>c.localName==='gridSpan'),vm=pk.find(c=>c.localName==='vMerge');
          const cont=vm&&vm.getAttributeNS(W,'val')!=='restart';
          row.push(cont?'':txt(tc));
          for(let i=1;i<(gs?+gs.getAttributeNS(W,'val')||1:1);i++)row.push('');
        }
        g.push(row);
      }
      nt++;sheets.push({name:pending||'ตาราง '+nt,g});pending='';
    }
  }
  if(!sheets.some(x=>x.g.some(r=>r.some(c=>idOf(c))))&&paras.length){
    const g=paras.map(t=>{let c=t.split(/\t|\s{2,}/).map(x=>x.trim()).filter(Boolean);return c.length<3?t.split(/\s+/):c});
    sheets.push({name:'ข้อความในเอกสาร',g});
  }
  return sheets;
}
async function load(file){
  if(!file)return;
  let src;
  try{
    if(/\.xlsx$/i.test(file.name)){
      const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());
      src=wb.worksheets.map(ws=>({name:ws.name,g:gridOf(ws)}));
    }else if(/\.docx$/i.test(file.name))src=await readDocx(await file.arrayBuffer());
    else{alert('รองรับไฟล์ .xlsx และ .docx (ถ้าเป็น .xls หรือ .doc ให้บันทึกเป็นรุ่นใหม่ก่อน)');return}
  }catch(e){alert('เปิดไฟล์ไม่ได้: '+e.message);return}
  S=src.map(({name,g})=>{
    const d=detect(g),s={name,label:labelOf(name),g,m:d.m,nc:d.nc,sample:d.sample,auto:true};
    s.rows=extract(g,s.m,s.auto,s.label);s.on=s.rows.length>0&&!/รวม|สรุป|total/i.test(name);return s;
  });
  $('cfg').hidden=false;render();
}
$('f').addEventListener('change',e=>load(e.target.files[0]));
const dz=$('drop');
['dragover','dragenter'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>load(e.dataTransfer.files[0]));
$('list').addEventListener('change',e=>{
  const t=e.target,s=S[t.dataset.k];if(!s)return;
  const f=t.dataset.f;
  if(f==='on')s.on=t.checked;
  else if(f==='auto'){s.auto=t.checked;s.rows=extract(s.g,s.m,s.auto,s.label)}
  else if(f==='label'){s.label=t.value;s.rows=extract(s.g,s.m,s.auto,s.label)}
  else{s.m[f]=+t.value;s.rows=extract(s.g,s.m,s.auto,s.label)}
  render();
});

async function build(){
  const school=$('school').value.trim(),date=$('date').value.trim(),ori=$('ori').value,by=$('by').value,rh=Math.min(40,Math.max(15,parseFloat($('rh').value)||23.4));
  const wb=new ExcelJS.Workbook(),names=new Set();
  const bd={top:{style:'thin'},left:{style:'thin'},bottom:{style:'thin'},right:{style:'thin'}};
  const widths=[5.2,14.8,9.3,12,13.4,8.7,4.7,4,8,8.7,4.4,3.9,7.4,5.4,6.2,4.4,4.3,7.1];
  const ctr={horizontal:'center',vertical:'middle',wrapText:true};
  const font=sz=>({name:'Angsana New',size:sz});
  for(const s of used()){
    const groups=new Map();
    s.rows.forEach(r=>{const k0=r.rm||s.label,k=by==='grade'?k0.split('/')[0]:k0;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});
    for(const [label,rows] of [...groups].sort((a,b)=>a[0].localeCompare(b[0],'th',{numeric:true}))){
      let nm=label.replace(/[:\\\/?*\[\]]/g,'.').slice(0,28)||'ชีต',x=nm,i=2;
      while(names.has(x))x=nm+'_'+i++;
      names.add(x);
      const ws=wb.addWorksheet(x,{pageSetup:{paperSize:9,orientation:ori,fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.3,footer:.3},printTitlesRow:'3:4'},headerFooter:{oddFooter:`&L${label.replace(/&/g,'&&')}&Cหน้า &P / &N&R${(date||'').replace(/&/g,'&&')}`}});
      widths.forEach((w,j)=>ws.getColumn(j+1).width=w);
      ws.mergeCells('A1:R1');ws.mergeCells('A2:R2');
      ws.getCell('A1').value='แบบบันทึกตรวจคัดกรองสุขภาพช่องปากในโรงเรียนและศูนย์เด็กเล็ก';
      ws.getCell('A2').value=`โรงเรียน……${school}……     ชั้น ……${label}……     วันที่ตรวจ ${date||'………………………………'}`;
      ['A1','A2'].forEach(a=>{ws.getCell(a).font=font(16);ws.getCell(a).alignment=ctr});
      ws.getRow(1).height=23.4;ws.getRow(2).height=24;
      ['A','B','C','D','E'].forEach((c,j)=>{ws.mergeCells(`${c}3:${c}4`);ws.getCell(c+'3').value=['ลำดับ','ID 13หลัก','คำนำหน้าชื่อ','ชื่อ','นามสกุล'][j]});
      ws.mergeCells('F3:I3');ws.mergeCells('J3:M3');ws.mergeCells('P3:R3');
      ws.getCell('F3').value='ฟันน้ำนม';ws.getCell('J3').value='ฟันแท้';ws.getCell('N3').value='เหงือก';ws.getCell('O3').value='มี';ws.getCell('P3').value='Tx.  plan';
      ['ฟันทั้งหมด','ฟันผุ','อุด','ถอน/หลุด','ฟันทั้งหมด','ฟันผุ','อุด','ถอน/หลุด','อักเสบ','หินปูน','อุด','ถอน','Sealant'].forEach((t,j)=>ws.getCell(4,6+j).value=t);
      for(let r=3;r<=4;r++)for(let c=1;c<=18;c++){const cell=ws.getCell(r,c);cell.font=font(14);cell.alignment=ctr;cell.border=bd}
      ws.getRow(3).height=21;ws.getRow(4).height=19.8;
      rows.forEach((p,n)=>{
        const r=5+n,row=ws.getRow(r);row.height=rh;
        row.getCell(1).value=n+1;const num=/^[1-9]\d{12}$/.test(p.id);row.getCell(2).value=num?Number(p.id):p.id;row.getCell(2).numFmt=num?'0':'@';
        row.getCell(3).value=p.pre;row.getCell(4).value=p.fn;row.getCell(5).value=p.ln;
        for(let c=1;c<=18;c++){
          const cell=row.getCell(c);cell.border=bd;cell.font=font(c<=5?16:14);
          cell.alignment={horizontal:c<=3?'center':(c<=5?'left':'center'),vertical:'middle'};
        }
      });
    }
  }
  const buf=await wb.xlsx.writeBuffer();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download=`แบบตรวจฟัน_${school||'โรงเรียน'}.xlsx`;
  document.body.appendChild(a);a.click();a.remove();
}
$('go').addEventListener('click',()=>build().catch(e=>alert('สร้างไฟล์ไม่สำเร็จ: '+e.message)));
</script>
